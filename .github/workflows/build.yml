name: Build and test

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew clean test build --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/btb-gradle.log"
      - name: Annotate Gradle failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ['RUNNER_TEMP']) / 'btb-gradle.log'
          if path.exists():
              lines = path.read_text(errors='replace').splitlines()
              highlights = [line for line in lines if 'error:' in line or 'FAILED' in line or 'Caused by:' in line]
              text = '\n'.join(highlights[:35] + ['--- log tail ---'] + lines[-70:])
              print('::error title=Gradle log::' + text.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
          PY
      - name: Annotate individual test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('build/test-results/test').glob('TEST-*.xml'):
              suite = ET.parse(path).getroot()
              for case in suite.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      message = f"{case.get('classname')}.{case.get('name')}: {failure.get('message')}\n{failure.text or ''}"
                      print('::error title=Test failure::' + message[:7000].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/test-results/test/**
            build/reports/tests/test/**
          if-no-files-found: ignore
