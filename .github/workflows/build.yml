name: Build and test

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Test and build
        run: ./gradlew clean test build --no-daemon --stacktrace
