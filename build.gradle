plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.1.0"
}

group = 'dev.moonaticks'
version = '0.1.0'

def paperVersion = '26.2.build.123-stable'

def targetJavaVersion = 25

repositories {
    mavenCentral()
    maven { name = 'papermc'; url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { name = 'momirealms'; url = 'https://repo.momirealms.net/releases/' }
    maven { name = 'jitpack'; url = 'https://jitpack.io' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperVersion}"
    // CustomGuiReworked is a server plugin and is deliberately not shaded.
    compileOnly 'com.github.amper24:CustomGuiReworked:2.4.0'
    // Optional: used only by CustomGuiReworked's CraftEngine hook at runtime.
    compileOnly('net.momirealms:craft-engine-core:26.7.2') { transitive = false }
    compileOnly('net.momirealms:craft-engine-bukkit:26.7.2') { transitive = false }
}

tasks.named('runServer', xyz.jpenilla.runpaper.task.RunServer) {
    minecraftVersion '26.2'
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') { expand props }
}
